# Calls the API's /health every 10 minutes, through the website's Worker, so that:
# - the API's host doesn't spin it down (Render's free plan does after 15 idle minutes), and
# - the Supabase free-tier database, which /health queries, isn't paused for inactivity.
# GitHub may run scheduled jobs late, or skip them when busy, and turns them off after 60 days
# without commits to the repository (re-enable under Actions → Keep awake).
name: Keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # A sleeping host can take a minute to wake, hence the retries and long timeout.
      - run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 90 "$HEALTH_URL"
        env:
          # Override in Settings → Secrets and variables → Actions → Variables.
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://guardioes-do-leca.benlubetzky.workers.dev/api/health' }}
