# Backs up the database and the report photos to Cloudflare R2 every day (see backend/backup.py).
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL, SUPABASE_URL, SUPABASE_SECRET_KEY  the same values as in backend/.env
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
name: Backup

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # The database is Postgres 17; pg_dump must be at least that. Ubuntu's own is older.
      - name: Install pg_dump 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - uses: astral-sh/setup-uv@v6

      - name: Back up to R2
        run: uv run --frozen --no-default-groups --group backup python backup.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
