[project]
name = "rio-leca-backend"
version = "0.1.0"
description = "API for Guardiões do Leça: sighting reports of invasive plants along the Rio Leça"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[tool.uv]
package = false
