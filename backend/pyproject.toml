[project]
name = "rio-leca-backend"
version = "0.1.0"
description = "API for Guardiões do Leça: sighting reports of invasive plants along the Rio Leça"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.3.1",
]

[tool.uv]
package = false
# Use the installed (signed) Python rather than a uv-downloaded one: Windows Smart App Control
# blocks the downloaded build's unsigned DLLs, including SSL, which the database connection needs.
python-preference = "only-system"
# Installed by `uv sync` too, so the admin page is ready to run.
default-groups = ["admin"]

[dependency-groups]
admin = [
    "streamlit>=1.65.0",
]
